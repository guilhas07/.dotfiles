; Feeds the wave behind the media title (Media.qml). Bar count must match barCount there.
[general]
bars = 24
framerate = 60
sleep_timer = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
