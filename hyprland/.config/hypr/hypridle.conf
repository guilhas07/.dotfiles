# Idle: dim 5m -> lock 10m -> screens off 10.5m -> suspend 30m.
# Lock screen is Quickshell (quickshell/Lock.qml). Apps holding an idle inhibitor
# (video, calls) pause all of this. KDE powerdevil still runs but its idle actions are off.

general {
    lock_cmd = pidof qs && qs ipc call lock lock      # Quickshell lock; no-op when already locked
    before_sleep_cmd = loginctl lock-session           # lock before any suspend (lid, power menu, idle)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300                                      # 5 min: dim laptop backlight
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600                                      # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630                                      # 10.5 min: screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800                                     # 30 min: suspend
    on-timeout = systemctl suspend
}
